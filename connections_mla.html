<!DOCTYPE html>
<html lang="en">
<head>

<title>C01 Connections</title>
<style>
:root {
  --bg: #f7f7fb; --card: #ffffff; --ink: #1d1d2b; --muted: #5d6077; --line: #e3e4ee;
  --accent: #5b4bdb; --accent-soft: #ecebfd; --good: #11875d; --good-soft: #e3f6ee; --warn: #b4540a; --warn-soft: #fdf0e3;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14141c; --card: #1e1e2a; --ink: #ececf4; --muted: #a3a6bd; --line: #33344a;
    --accent: #9d92ff; --accent-soft: #2a2747; --good: #4fd6a0; --good-soft: #17352a; --warn: #ffb36b; --warn-soft: #3a2a19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14141c; --card: #1e1e2a; --ink: #ececf4; --muted: #a3a6bd; --line: #33344a;
  --accent: #9d92ff; --accent-soft: #2a2747; --good: #4fd6a0; --good-soft: #17352a; --warn: #ffb36b; --warn-soft: #3a2a19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.tabs button, .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; border-radius: 999px; font: inherit; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.task-h { margin: 22px 0 8px; font-size: 1.15rem; }
.conn { border-left: 5px solid var(--accent); }
.conn h3 { margin: 0 0 6px; font-size: 1.02rem; }
.rule { background: var(--good-soft); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
.trap { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
.rule b, .trap b { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.rule b { color: var(--good); } .trap b { color: var(--warn); }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.tbl { overflow-x: auto; }
a { color: var(--accent); }
.day { display: flex; gap: 12px; align-items: flex-start; }
.day input { width: 22px; height: 22px; margin-top: 3px; flex: none; accent-color: var(--accent); }
.day h3 { margin: 0 0 4px; font-size: 1rem; }
.day.done h3 { text-decoration: line-through; color: var(--muted); }
.day ol { margin: 4px 0 0; padding-left: 20px; }
.recall-card { min-height: 220px; display: flex; flex-direction: column; justify-content: center; }
.recall-card .q { font-size: 1.15rem; font-weight: 600; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 10px 16px; border-radius: 10px; font: inherit; cursor: pointer; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.good { background: var(--good); color: #fff; border-color: var(--good); }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 12px; }
.progress span { display: block; height: 100%; background: var(--accent); }
select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); max-width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <h1>C01 Connections: Domains 1 &amp; 2</h1>
  <p class="sub">The "when X, pick Y, and here's the trap" relationships behind the questions you missed. Written by Claude from AWS documentation (each card links its page). Not official AWS material.</p>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="plan" aria-selected="true">📅 Plan</button>
    <button role="tab" data-tab="map" aria-selected="false">🧠 Connections</button>
    <button role="tab" data-tab="recall" aria-selected="false">⚡ Recall (5 at a time)</button>
    <button role="tab" data-tab="coverage" aria-selected="false">✅ Coverage audit</button>
  </div>
  <div id="view"></div>
  <p class="small muted" style="margin-top:24px">Practice: <a href="exam_simulator_mla.html">Exam simulator</a>. Progress on this page is saved in this browser only.</p>

<script>
const CARDS = [
  // ---- 1.1 ----
  { t: '1.1', title: 'Firehose vs Kinesis Data Streams', clue: 'Stream data must land in S3 (maybe as Parquet) with no code to manage.', rule: 'Firehose = managed delivery to a destination, with optional format conversion. Kinesis Data Streams = your own consumers, replay, real-time custom processing.', trap: 'Firehose converts only JSON to Parquet/ORC. CSV needs a Lambda transform to JSON first.', src: 'https://docs.aws.amazon.com/firehose/latest/dev/record-format-conversion.html' },
  { t: '1.1', title: 'Throttled Kinesis, but under total capacity', clue: 'ProvisionedThroughputExceeded errors while the stream is mostly idle; one shard is hot.', rule: 'The partition key picks the shard. A low-variety key (event type, country) creates a hot shard. Use a high-cardinality key (user or session ID). Each shard accepts 1 MB/s or 1,000 records/s of writes.', trap: 'Adding shards doesn’t help, because the same key still lands on one shard.', src: 'https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html' },
  { t: '1.1', title: 'S3 503 Slow Down', clue: 'Many workers read or write under one S3 prefix and get 503 errors.', rule: 'Each prefix supports at least 5,500 GET or 3,500 PUT requests per second, and you can have unlimited prefixes. Spread the keys across prefixes.', trap: 'Transfer Acceleration speeds up LONG-DISTANCE transfers, not request rates.', src: 'https://docs.aws.amazon.com/AmazonS3/latest/userguide/optimizing-performance.html' },
  { t: '1.1', title: 'Training input: File vs FastFile vs Pipe', clue: 'Training waits a long time to download data, or the dataset is bigger than the disk.', rule: 'File = download everything first (the default). FastFile = streams from S3 on demand, looks like local files, no code change. Pipe = FIFO stream that needs code changes (mostly replaced by FastFile).', trap: 'FastFile supports S3 prefixes only and works best for sequential reads.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/model-access-training-data.html' },
  { t: '1.1', title: 'FSx for Lustre vs EFS as training input', clue: 'Many jobs reread a huge dataset, with random access and very high throughput needs.', rule: 'FSx for Lustre (linked to S3) = hundreds of GB/s and millions of IOPS; mounting is fast. EFS = data is ALREADY in EFS (for example, shared with EC2). Both need the training job in a VPC.', trap: 'For EFS, the data must already be there. FSx for NetApp ONTAP isn’t a training input.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/model-access-training-data.html' },
  { t: '1.1', title: 'Feature Store: online vs offline', clue: 'Inference needs the latest features in milliseconds, and training needs history.', rule: 'Online = only the latest record per ID, millisecond GetRecord, for inference. Offline = every historical record in S3, for training and batch. Enable both and they stay in sync.', trap: 'In the online store, the latest EVENT TIME wins, not the latest arrival. A late, older record doesn’t overwrite the online store but is added to the offline store.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/feature-store-concepts.html' },
  { t: '1.1', title: 'Pick the file format by access pattern', clue: 'Queries read a few columns of a wide table.', rule: 'Parquet/ORC = columnar, so you read only the columns you need (analytics, Athena). Avro = row-based with schema evolution (streaming writes). CSV/JSON = row-based and simple. RecordIO-protobuf = SageMaker sparse/pipe training (Factorization Machines).', trap: 'Gzip on CSV shrinks the files, but you still read every column.', src: 'https://docs.aws.amazon.com/firehose/latest/dev/record-format-conversion.html' },
  { t: '1.1', title: 'Merge RDS and S3 data, serverless', clue: 'Nightly join of a database and data lake files with the least ops.', rule: 'Glue connection (JDBC to RDS) + crawlers + a scheduled Glue ETL (Spark) job that writes Parquet to S3.', trap: 'Cron on EC2, Redshift clusters and DMS into RDS all add servers or go the wrong way.', src: 'https://docs.aws.amazon.com/glue/latest/dg/glue-connections.html' },
  // ---- 1.2 ----
  { t: '1.2', title: 'Encoding: ordinal vs one-hot vs similarity', clue: 'Categorical columns of different kinds.', rule: 'Has an order (S<M<L) → ordinal. A few unordered values (card/cash) → one-hot. Thousands of noisy values (typos) → similarity encode (embeddings, low dimensions).', trap: 'One-hot on 30,000 cities = 30,000 sparse columns. Ordinal on unordered categories invents a fake order.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/canvas-transform.html' },
  { t: '1.2', title: 'Scalers', clue: 'A numeric feature needs scaling for a distance-based or linear model.', rule: 'Standard = mean/std. Min Max = squeeze to a range. Max Absolute = divide by the largest absolute value. Robust = median/quartiles, so it stays steady when real outliers must remain.', trap: 'Min Max and Standard get distorted by a few extreme values.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/canvas-transform.html' },
  { t: '1.2', title: 'Skew, missing values, outliers', clue: 'Long right tail, gaps in the data, impossible readings.', rule: 'Skewed values → log(1+x). Missing numeric values in skewed data → median (Data Wrangler offers mean or median; categorical gaps get the most frequent value). Known physical limits → Min-Max outlier thresholds. Statistical outliers → standard deviation, quantile or robust methods. Fixes: clip, remove or invalidate.', trap: 'The mean gets dragged by outliers. Quantile removal can delete valid extreme readings.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/canvas-transform.html' },
  { t: '1.2', title: 'Streaming transforms: Lambda vs Flink', clue: 'Rolling windows, per-key state, late events.', rule: 'Simple per-record fixes → Lambda or a Firehose transform. Windows, state and late events → Managed Service for Apache Flink. Batch → Glue or EMR Spark.', trap: 'Lambda keeps no memory between invocations, so it can’t hold a 5-minute window.', src: 'https://docs.aws.amazon.com/managed-flink/latest/java/what-is.html' },
  { t: '1.2', title: 'Ground Truth automated labeling', clue: 'Cut the cost of labeling a large dataset.', rule: 'Active learning: the model labels high-confidence items and humans label the rest. Minimum 1,250 objects (AWS suggests 5,000). Built-in task types only: single-label image classification, single-label text classification, bounding box, semantic segmentation.', trap: 'Not supported for multi-label, custom templates or streaming jobs. (Ground Truth is closed to new customers, but C01 still tests it.)', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/sms-automated-labeling.html' },
  { t: '1.2', title: 'BlazingText input', clue: 'Preparing text for supervised BlazingText.', rule: 'One sentence per line, labels as __label__X, space-separated tokens (punctuation split off). Word2Vec mode = unsupervised word vectors. Subword vectors handle words it hasn’t seen.', trap: 'Not CSV with headers, and not RecordIO-protobuf.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/blazingtext.html' },
  // ---- 1.3 ----
  { t: '1.3', title: 'Which bias metric? CI vs DPL vs DI', clue: 'A fairness number is in the question: what is it measuring?', rule: 'CI = group SIZES (pre-training), (na−nd)/(na+nd), range −1 to 1, 0 = balanced. DPL = LABEL rates in the training data (pre-training), qa−qd, 0 = parity. DI = model PREDICTION rates (post-training), q′d/q′a, 1 = parity.', trap: 'DI parity is 1, not 0. DI 0.8 means group d is approved at 80% of group a’s rate.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-data-bias-metric-true-label-imbalance.html' },
  { t: '1.3', title: 'Fixing class imbalance', clue: 'The rare class is underrepresented.', rule: 'Tabular numeric data → SMOTE (new synthetic points between neighbors). Images → augmentation (flips, crops). XGBoost → scale_pos_weight = negatives/positives. Evaluation splits → stratified.', trap: 'Random oversampling just duplicates rows (overfitting risk), and undersampling throws data away.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/canvas-transform.html' },
  { t: '1.3', title: 'Data quality: Glue DQ in ETL vs Catalog vs DataBrew', clue: 'Stop bad rows before they reach training and see which rows failed.', rule: 'Glue Data Quality inside the ETL job = proactive; can identify and route failing records. On the Data Catalog = checks data at rest, gives rule recommendations, but can’t list failing records. DataBrew = visual profiling and rules for analysts. Rules are written in DQDL.', trap: 'Catalog-level checks happen AFTER the load.', src: 'https://docs.aws.amazon.com/glue/latest/dg/glue-data-quality.html' },
  { t: '1.3', title: 'PII: find vs transform', clue: 'Sensitive data in S3 or in a pipeline.', rule: 'FIND which buckets have PII, org-wide → Macie. TRANSFORM in a pipeline → Glue Detect PII: redact (******), partial redact, or SHA-256 hash (the same input gives the same token, so records stay linkable). Locate PII in text via an API → Comprehend DetectPiiEntities.', trap: 'Macie reports; it doesn’t mask. Redaction breaks the ability to link records.', src: 'https://docs.aws.amazon.com/glue/latest/dg/detect-PII.html' },
  { t: '1.3', title: 'Training security knobs', clue: 'Encrypt or isolate a training job.', rule: 'VolumeKmsKeyId = storage volumes. OutputDataConfig KmsKeyId = artifacts in S3. EnableInterContainerTrafficEncryption = traffic BETWEEN nodes (slower). EnableNetworkIsolation = no outbound calls (not encryption). VpcConfig = private networking.', trap: 'Network isolation ≠ encryption.', src: 'https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateTrainingJob.html' },
  { t: '1.3', title: 'Data residency across accounts', clue: 'Data must never be processed outside one Region, in every account.', rule: 'Use an SCP on the OU that denies requests when aws:RequestedRegion isn’t the allowed Region (exempt global services such as IAM).', trap: 'Per-role IAM policies are easy to miss and can be edited. IP-based bucket policies don’t control Regions.', src: 'https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html' },
  { t: '1.3', title: 'Splits that don’t lie', clue: 'Great validation score, poor production score.', rule: 'Time-based data → split by time (past trains, future validates). Rare class → stratified split. Watch for leakage: features or rows from the future.', trap: 'A stratified RANDOM split still leaks future data in time series.', src: '' },
  // ---- 2.1 ----
  { t: '2.1', title: 'Built-in algorithm map', clue: 'Match the problem shape to the algorithm.', rule: 'Tabular → XGBoost / LightGBM / CatBoost / Linear Learner (AutoGluon = automatic stacking). Sparse clicks → Factorization Machines. Many related time series → DeepAR. Numeric anomalies → Random Cut Forest. User↔IP anomalies → IP Insights. Groups → k-means. Fewer features → PCA. Topics → LDA/NTM. Similarity embeddings → Object2Vec. Text classes or word vectors → BlazingText. Translation or summaries → Seq2Seq.', trap: 'Factorization Machines supports binary classification or regression only (no multiclass) and trains on recordIO-protobuf Float32.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html' },
  { t: '2.1', title: 'Images: classify vs detect vs segment', clue: 'How precise must the location be?', rule: 'One label per image → image classification. Boxes around objects → object detection. Every pixel labeled (area or outline) → semantic segmentation.', trap: 'Boxes overstate the area of irregular shapes.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html' },
  { t: '2.1', title: 'DeepAR details', clue: 'Forecasting many products, with quantiles and new items.', rule: 'One model across all series; beats ARIMA/ETS with hundreds of related series; gives probabilistic (P10/P90) forecasts; can forecast new similar series. cat = fixed group labels; dynamic_feat = time-varying features.', trap: 'dynamic_feat must also cover the FUTURE prediction_length points at inference. A single series → ARIMA/ETS may win.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/deepar.html' },
  { t: '2.1', title: 'AI service before custom model', clue: 'A business need that an existing AI service already covers.', rule: 'Common objects → Rekognition DetectLabels. YOUR objects with a few hundred images → Rekognition Custom Labels. Brand names in translations → Translate custom terminology. Speech to text → Transcribe.', trap: 'Training from scratch on 300 images = overfitting and needs ML skills.', src: 'https://docs.aws.amazon.com/rekognition/latest/customlabels-dg/what-is.html' },
  { t: '2.1', title: 'Bedrock vs JumpStart', clue: 'Using a foundation model: how much control do you need?', rule: 'Bedrock = fully managed API, no infrastructure. JumpStart = pretrained models you fine-tune and deploy on YOUR SageMaker instances, VPC and container.', trap: '“Choose instance types / control the container” → not Bedrock.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/algos.html' },
  { t: '2.1', title: 'Interpretability and cost', clue: 'A regulator asks why, or the budget is tight.', rule: 'Explain an existing model per decision → Clarify SHAP (local for one prediction, global for the whole model). Cost: the simplest model that meets the need wins (BlazingText on CPU beats an LLM for fixed-label text classification).', trap: 'Swapping to a linear model also explains decisions, but it’s more rework and usually costs accuracy.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-shapley-values.html' },
  // ---- 2.2 ----
  { t: '2.2', title: 'AMT strategies', clue: 'How to search hyperparameters.', rule: 'Bayesian = learns from finished jobs (less benefit when massively parallel). Random = independent choices, so maximum parallelism works fine. Hyperband = iterative algorithms that report intermediate metrics; stops weak trials itself. Grid = categorical parameters only.', trap: 'With Hyperband, set TrainingJobEarlyStoppingType to OFF. Hyperband needs per-epoch metrics.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/automatic-model-tuning-how-it-works.html' },
  { t: '2.2', title: 'Ranges, warm start, early stopping', clue: 'Tuning setup details.', rule: 'Log scale for ranges that span orders of magnitude (learning rate 0.0001–1). Reverse log for values close to 1 (range < 1.0). Warm start: IDENTICAL_DATA_AND_ALGORITHM (same data and image) vs TRANSFER_LEARNING (new data or new image version); up to 5 parents, same objective metric. Early stopping AUTO compares each job to the median of earlier jobs at the same epoch.', trap: 'Custom PyTorch scripts must log the metric every epoch, or early stopping never fires.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/automatic-model-tuning-warm-start.html' },
  { t: '2.2', title: 'XGBoost knobs', clue: 'Overfitting or class imbalance in XGBoost.', rule: 'Less overfitting: ↓max_depth, ↑min_child_weight, subsample/colsample < 1, ↑alpha (L1) / lambda (L2) / gamma, ↓eta with early_stopping_rounds. Imbalance: scale_pos_weight = negatives/positives.', trap: '↑max_depth or more rounds without early stopping = MORE overfitting.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/xgboost_hyperparameters.html' },
  { t: '2.2', title: 'Managed spot training', clue: 'Cut the training bill, and interruptions are OK.', rule: 'Saves up to 90%. Checkpoint to /opt/ml/checkpoints, which syncs to S3 so training resumes after an interruption. MaxWaitTimeInSeconds must be greater than MaxRuntimeInSeconds.', trap: 'No automatic fallback to On-Demand. Without checkpoints, training restarts from zero.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/model-managed-spot-training.html' },
  { t: '2.2', title: 'Data parallel vs model parallel', clue: 'Training is too slow, or the model is too big.', rule: 'Model doesn’t fit on one GPU → model parallel. Model fits but there’s lots of data → data parallel. Global batch = replicas × per-replica batch. Steps per epoch = samples ÷ global batch.', trap: 'Data parallel puts a full copy of the model on every GPU.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/distributed-training.html' },
  { t: '2.2', title: 'Training container paths', clue: 'Where files go in script mode.', rule: '/opt/ml/model (SM_MODEL_DIR) → becomes model.tar.gz, which gets deployed. /opt/ml/input/data/<channel> (SM_CHANNEL_X) → input data. /opt/ml/output/data → other outputs. /opt/ml/checkpoints → resume state.', trap: 'Anything saved in /tmp is lost.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/model-train-storage-env-var-summary.html' },
  { t: '2.2', title: 'Model Registry approval', clue: 'Audit trail plus deploying only approved versions.', rule: 'Model package group → versions. PendingManualApproval → Approved starts CI/CD. Approved → Rejected redeploys the latest version that’s still Approved.', trap: 'S3 versioning or Git tags don’t give you an approval workflow.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-approve.html' },
  { t: '2.2', title: 'Bedrock customization', clue: 'Make a foundation model behave your way.', rule: 'Labeled prompt→response pairs → supervised fine-tuning. Reward functions → reinforcement fine-tuning. Big model’s skill into a smaller model → distillation. Add facts at query time → RAG knowledge base. Serve a custom model → Provisioned Throughput or an on-demand custom model deployment.', trap: 'Calling the base model ID doesn’t use your fine-tuned model.', src: 'https://docs.aws.amazon.com/bedrock/latest/userguide/custom-models.html' },
  { t: '2.2', title: 'Forgetting, size, ensembles', clue: 'Fine-tuning side effects, edge devices, combining models.', rule: 'Catastrophic forgetting → PEFT/LoRA, lower learning rate, mix in old data. Smaller model → quantize (FP32→INT8), prune, distill. Bagging reduces variance (overfitting); boosting reduces bias (sequential); stacking = a meta-model combines other models.', trap: 'FP64 makes a model BIGGER.', src: '' },
  // ---- 2.3 ----
  { t: '2.3', title: 'Confusion matrix math', clue: 'Numbers for TP, FP, FN and TN are given.', rule: 'Precision = TP/(TP+FP), “of what I flagged”. Recall = TP/(TP+FN), “of what exists”. F1 = the harmonic mean of the two. Multiclass: the heat map’s bright off-diagonal cells show which classes get swapped.', trap: 'Accuracy looks great on imbalanced data.', src: '' },
  { t: '2.3', title: 'Which metric? Follow the cost', clue: 'Which mistake costs more?', rule: 'Missed positives are expensive → recall. False alarms are expensive → precision. Compare models without picking a threshold → AUC. Regression: MAE = typical error; RMSE = punishes big misses.', trap: 'Raise the threshold → fewer false positives, lower recall. Lower it → the opposite. No retraining needed.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/xgboost-tuning.html' },
  { t: '2.3', title: 'Read the loss curves', clue: 'Training vs validation loss over epochs.', rule: 'Training ↓, validation ↑ → overfitting: stop early or regularize. Both high → underfitting: add capacity or features. Barely moving → learning rate or vanishing gradients. NaN → exploding values.', trap: '', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/debugger-built-in-rules.html' },
  { t: '2.3', title: 'Debugger rules and actions', clue: 'Automatically catch training problems.', rule: 'ExplodingTensor = NaN/inf. VanishingGradient = tiny gradients (sigmoid depth → use ReLU or batch norm). Overfit / Overtraining = validation gets worse. LossNotDecreasing. Actions: StopTraining, Email, SMS (via SNS).', trap: 'Built-in actions don’t work on jobs with spot interruptions. Model Monitor is for endpoints, not training.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/debugger-built-in-actions.html' },
  { t: '2.3', title: 'Clarify: bias and explanations', clue: 'Fairness numbers or “why this prediction”.', rule: 'Pre-training: CI, DPL. Post-training: DI, DPPL. SHAP: local (one prediction) and global (the whole model).', trap: 'DI compares PREDICTIONS; DPL compares LABELS.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/clarify-post-training-bias-metric-di.html' },
  { t: '2.3', title: 'Shadow comparison, baselines, reproducibility', clue: 'Prove the new model is better, safely and repeatably.', rule: 'Shadow test + DataStorageConfig captures both variants’ responses to compare predictions (users see production only). Baseline first (majority class or a simple model). Reproducibility → SageMaker managed MLflow (training job MlflowConfig).', trap: 'Latency and error metrics alone don’t compare prediction QUALITY.', src: 'https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateInferenceExperiment.html' },
  { t: '1.1', title: 'S3 storage classes', clue: 'Pick a storage class by how often data is read and whether it can be re-created.', rule: 'Frequent → Standard. Monthly + millisecond access → Standard-IA (One Zone-IA if re-creatable). Quarterly + millisecond access → Glacier Instant Retrieval. Yearly, minutes to hours → Glacier Flexible Retrieval. Almost never, hours → Deep Archive. Unknown or changing → Intelligent-Tiering (no retrieval fees).', trap: 'One Zone-IA isn’t resilient to losing an AZ, so use it only for data you can re-create. Flexible Retrieval and Deep Archive need a restore first.', src: 'https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html' },
  { t: '1.1', title: 'Getting data out of sources', clue: 'DynamoDB, Kafka, replaying a stream.', rule: 'DynamoDB → S3: export to S3 (needs PITR; uses no read capacity; full or incremental). Existing Kafka apps → MSK (no code change). Replay a stream → KDS retention (24 h default, up to 365 days).', trap: 'A Scan uses read capacity on the live table. Firehose can’t replay.', src: 'https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/S3DataExport.HowItWorks.html' },
  { t: '1.2', title: 'Dedupe, binning, splitting, binary encoding', clue: 'Cleaning and feature shapes.', rule: 'Fuzzy duplicates with no shared ID → Lake Formation FindMatches (outputs a match_id column or removes duplicates). Non-linear effect in a linear model → binning (quantile bins for uneven data). Timestamp/address → split into hour, weekday, postal code. ~1,000 clean categories → binary encoding (~10 columns).', trap: 'DISTINCT and drop duplicates catch only exact matches.', src: 'https://docs.aws.amazon.com/glue/latest/dg/machine-learning.html' },
  { t: '1.2', title: 'Labeling workforces', clue: 'Who is allowed to see the data?', rule: 'Confidential data → private workforce (your staff, via Cognito or OIDC). Otherwise you can use a vendor-managed workforce.', trap: 'Mechanical Turk closed 2026-09-30 and Ground Truth is closed to new customers, but C01 may still ask about them.', src: 'https://docs.aws.amazon.com/sagemaker/latest/dg/sms-workforce-management.html' },
  { t: '1.3', title: 'Bias sources, shuffling, S3 encryption', clue: 'How data went wrong, or how to protect it.', rule: 'Collected from an unrepresentative group → selection bias. Values recorded wrongly or inconsistently → measurement bias. Data sorted by label → shuffle or stratify before splitting. Need to control the key policy → SSE-KMS with a customer managed key (SSE-S3 is the default, and AWS manages those keys).', trap: 'Changing the bucket default doesn’t re-encrypt existing objects (use S3 Batch Operations Copy).', src: 'https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingEncryption.html' },
  { t: '2.1', title: 'Transcribe, Bedrock evaluation, feasibility', clue: 'Choosing AI services and models.', rule: 'A few misheard names → custom vocabulary. Context or homophones with lots of domain text → custom language model. Compare FMs on your own prompts → Bedrock model evaluation (automatic, LLM judge, or humans). A known deterministic rule → don’t use ML.', trap: 'Custom vocabulary DisplayAs isn’t applied while a custom language model is active.', src: 'https://docs.aws.amazon.com/transcribe/latest/dg/improving-accuracy.html' },
  { t: '2.2', title: 'Regularization and ensembles', clue: 'Which knob for which problem?', rule: 'L1 = drives useless weights to exactly 0 (feature selection). L2 / weight decay = shrinks all weights. Dropout = randomly turns off neurons (neural networks). Bagging (random forest) = less variance. Boosting = less bias. Too many features for the data → feature selection or PCA.', trap: 'More rounds or depth without early stopping fixes underfitting, not overfitting.', src: '' },
  { t: '2.3', title: 'ROC/AUC and underfitting', clue: 'Reading the scores.', rule: 'AUC = the chance a random positive is ranked above a random negative, across all thresholds (0.5 = random). Training and validation both low and close → underfitting. Barely beats the baseline → not ready.', trap: 'AUC isn’t accuracy. Leakage makes scores look suspiciously HIGH.', src: '' }

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

function cardHtml(c) {
  return `<div class="card conn"><h3>${esc(c.title)}</h3><div class="muted small">When you see: ${esc(c.clue)}</div>
    <div class="rule"><b>Connection</b>${esc(c.rule)}</div>${c.trap ? `<div class="trap"><b>Trap</b>${esc(c.trap)}</div>` : ''}
    ${c.src ? `<a class="small" href="${c.src}" target="_blank" rel="noopener">AWS documentation</a>` : '<span class="small muted">Standard ML concept</span>'}</div>`;
}
function renderMap() {
  view.innerHTML = Object.keys(TASKS).map(t => `<h2 class="task-h" id="t${t}">Task ${t} · ${TASKS[t]}</h2>` + CARDS.filter(c => c.t === t).map(cardHtml).join('')).join('');
}

let deck = [], pos = 0, revealed = false, filter = 'all';
function newDeck() {
  let pool = CARDS.map((c, i) => i).filter(i => filter === 'all' || filter === 'notyet' ? true : (filter.length === 1 ? CARDS[i].t[0] === filter : CARDS[i].t === filter));
  if (filter === 'notyet') pool = pool.filter(i => !st.known[i]);
  pool.sort(() => Math.random() - 0.5);
  pool.sort((a, b) => (st.known[a] ? 1 : 0) - (st.known[b] ? 1 : 0));
  deck = pool.slice(0, 5); pos = 0; revealed = false;
}
function renderRecall() {
  const opts = [['all', 'All cards'], ['notyet', 'Only “not yet” cards'], ['1', 'Domain 1'], ['2', 'Domain 2'], ...Object.keys(TASKS).map(t => [t, `Task ${t} ${TASKS[t]}`])];
  const knownCount = Object.values(st.known).filter(Boolean).length;
  let body;
  if (!deck.length) body = `<div class="card">Nothing left in this filter. Pick another or reset.</div>`;
  else if (pos >= deck.length) body = `<div class="card"><h3 style="margin-top:0">Deck of 5 done ✅</h3><p>Take a breath. ${knownCount} of ${CARDS.length} cards are green.</p><div class="row"><button class="btn primary" id="again">Next 5</button></div></div>`;
  else {
    const c = CARDS[deck[pos]];
    body = `<div class="progress"><span style="width:${pos / deck.length * 100}%"></span></div>
      <div class="card recall-card"><div class="muted small">Task ${c.t} · card ${pos + 1} of ${deck.length}</div><div class="q">${esc(c.title)}</div><p>${esc(c.clue)}</p>
      <p class="muted small">Say the connection out loud (or type it on paper) before revealing.</p>
      ${revealed ? `<div class="rule"><b>Connection</b>${esc(c.rule)}</div>${c.trap ? `<div class="trap"><b>Trap</b>${esc(c.trap)}</div>` : ''}
        <div class="row"><button class="btn good" id="got">I had it</button><button class="btn" id="miss">Not yet</button></div>`
      : `<div class="row"><button class="btn primary" id="reveal">Reveal</button></div>`}</div>`;
  }
  view.innerHTML = `<div class="row" style="margin-top:0"><select id="flt">${opts.map(([v, l]) => `<option value="${v}" ${v === filter ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
    <span class="small muted">${knownCount}/${CARDS.length} green</span><button class="btn small" id="rst">Reset greens</button></div><div style="margin-top:12px">${body}</div>`;
  document.getElementById('flt').onchange = e => { filter = e.target.value; newDeck(); renderRecall(); };
  document.getElementById('rst').onclick = () => { st.known = {}; save(); newDeck(); renderRecall(); };
  const b = id => document.getElementById(id);
  if (b('reveal')) b('reveal').onclick = () => { revealed = true; renderRecall(); };
  if (b('got')) b('got').onclick = () => { st.known[deck[pos]] = true; save(); pos++; revealed = false; renderRecall(); };
  if (b('miss')) b('miss').onclick = () => { st.known[deck[pos]] = false; save(); deck.push(deck[pos]); pos++; revealed = false; renderRecall(); };
  if (b('again')) b('again').onclick = () => { newDeck(); renderRecall(); };
}
