* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
.wrap { max-width:640px; margin:0 auto; padding:18px 16px 60px; }
.top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
h1 { font-size:1.25rem; margin:0; }
select, .btn { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:8px 12px; }
.bar { height:8px; background:var(--line); border-radius:99px; margin:14px 0; overflow:hidden; }
.bar span { display:block; height:100%; background:var(--accent); transition:width .2s; }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
.label { color:var(--muted); font-size:.85rem; margin-bottom:4px; }
.clue { font-size:1.3rem; font-weight:700; margin:0 0 16px; }

.opt.right { border-color:var(--good); background:var(--goodbg); }
.opt.wrong { border-color:var(--bad); background:var(--badbg); }
.opt:disabled { cursor:default; }
.why { margin-top:12px; padding:12px 14px; border-radius:12px; background:var(--goodbg); }
.why.miss { background:var(--badbg); }
.why b { display:block; margin-bottom:2px; }
.next { margin-top:14px; width:100%; padding:14px; font-size:1.05rem; background:var(--accent); color:#fff; border:none; border-radius:12px; cursor:pointer; }
.score { color:var(--muted); font-size:.9rem; }
.big { font-size:2.4rem; font-weight:800; margin:6px 0; }
.small { font-size:.85rem; color:var(--muted); }
a { color:var(--accent); }
</style>
</head>

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const app = document.getElementById('app'), bar = document.getElementById('bar'), dom = document.getElementById('dom');
let queue = [], done = 0, right = 0, total = 10, cur = null, opts = [];
function pool() { return Q.map((q, i) => i).filter(i => dom.value === 'all' || String(Q[i][0]) === dom.value); }
function newRound() {
  const p = pool();
  const missed = shuffle(p.filter(i => st.miss[i] > 0)), fresh = shuffle(p.filter(i => !st.seen[i] && !(st.miss[i] > 0))), rest = shuffle(p.filter(i => st.seen[i] && !(st.miss[i] > 0)));
  queue = missed.slice(0, 4).concat(fresh, rest).slice(0, 10); total = queue.length; done = 0; right = 0; next();
}
function next() {
  bar.style.width = (done / total * 100) + '%';
  if (!queue.length) return finish();
  cur = queue.shift(); const q = Q[cur];
  opts = shuffle([q[2], q[3][0]]); // the right answer vs. its most tempting trap
  app.innerHTML = `<div class="card"><div class="label">When the question says…</div><p class="clue">${esc(q[1])}</p>
    ${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}<div id="fb"></div></div>
    <p class="score">${done} / ${total} done · ${right} right first try</p>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
}
function answer(i) {
  const q = Q[cur], ok = opts[i] === q[2];
  app.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (opts[j] === q[2]) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
  st.seen[cur] = 1;
  if (ok) { right++; done++; st.miss[cur] = Math.max(0, (st.miss[cur] || 0) - 1); }
  else { st.miss[cur] = (st.miss[cur] || 0) + 1; queue.splice(Math.min(3, queue.length), 0, cur); total++; done++; }
  save();
  document.getElementById('fb').innerHTML = `<div class="why ${ok ? '' : 'miss'}"><b>${ok ? '✓ Right' : '✗ Answer: ' + esc(q[2])}</b>${esc(q[4])}</div><button class="next" id="nx">Next →</button>`;
  document.getElementById('nx').onclick = next; document.getElementById('nx').focus();
}
function finish() {
  bar.style.width = '100%';
  const open = pool().filter(i => st.miss[i] > 0).length;
  app.innerHTML = `<div class="card" style="text-align:center"><div class="label">Round done</div><div class="big">${total - right === 0 ? 'Perfect' : (total - right) + ' miss' + (total - right > 1 ? 'es' : '')}</div>
    <p>${right === total ? 'Clean round.' : 'Missed cards came back until you got them right.'} ${open ? open + ' card' + (open > 1 ? 's' : '') + ' still marked as missed will appear first next round.' : ''}</p>
    <button class="next" id="again">Next 10 →</button></div>`;
  document.getElementById('again').onclick = newRound;
}
dom.onchange = newRound;
document.addEventListener('keydown', e => { const n = parseInt(e.key, 10); const b = app.querySelectorAll('.opt'); if (n >= 1 && n <= 2 && b[n - 1] && !b[n - 1].disabled) b[n - 1].click(); else if (e.key === 'Enter' && document.getElementById('nx')) document.getElementById('nx').click(); });
newRound();
</script>
</body>
</html>
